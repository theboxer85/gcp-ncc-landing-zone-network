      sec-trust-usw2:
        region: "us-west2"
        ip_cidr_range: "10.20.4.64/28"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges: {}

      sec-dmz-usw4:
        region: "us-west4"
        ip_cidr_range: "10.10.6.0/23"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges: {}

      sec-dmz-usw2:
        region: "us-west2"
        ip_cidr_range: "10.20.6.0/23"
        private_ip_google_access: true
        flow_logs_enabled: true
