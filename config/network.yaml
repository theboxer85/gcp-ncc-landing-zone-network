# =============================================================================
# NETWORKING CONFIGURATION
# =============================================================================
# Consumed by the central config module. Project references must match
# resource-hierarchy-projects.yaml. Values marked TODO are unconfirmed.
#
# Addressing: one /16 per region, reachable from on-premises.
#   us-west4  10.10.0.0/16
#   us-west2  10.20.0.0/16
# Both regions use the same layout, so re-basing a region changes only the
# second octet.
#
# VPC blocks per region (us-west4 shown, us-west2 is the same in 10.29):
#   hybrid           10.10.0.0/25
#   shared-services  10.10.2.0/23
#   security         10.10.4.0/22  (untrust, mgmt, trust /28s, DMZ /23)
#   prod             10.10.64.0/20
#   preprod          10.10.128.0/20
#   per-workload     10.10.192.0/18  (PHI, research, added later)
#
# Non-routable: 100.64.0.0/10. Never advertised to on-premises and never shared
# through the NCC hub, so only the VPC that holds a range can reach it. Used for
# GKE pods and services, proxy-only and PSC NAT subnets, and the firewall HA
# interfaces.
#   us-west4  100.96.0.0/16    us-west2  100.97.0.0/16
#   GKE pods 100.64.0.0/14, GKE services 100.72.0.0/18
#
# isolated: 172.17.0.0/19 us-west4, 172.16.0.0/19 us-west2. Not on the hub.
# =============================================================================

vpcs:
  # prod: 10.10.64.0/20 and 10.20.64.0/20. Edge spoke.
  prod:
    project_ref: "prj-prod-host-net"
    network_name: "vpc-prod"
    routing_mode: "GLOBAL"
    delete_default_routes_on_create: true
    network_firewall_policy_enforcement_order: "BEFORE_CLASSIC_FIREWALL"
    ncc_attachment: "edge"

    subnets:
      prod-apps-usw4:
        region: "us-west4"
        ip_cidr_range: "10.10.64.0/21"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges: {}

      prod-gke-usw4:
        region: "us-west4"
        ip_cidr_range: "10.10.72.0/24"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges:
          pods: "100.64.0.0/16"
          services: "100.72.0.0/20"

      prod-psc-endpoints-usw4:
        region: "us-west4"
        ip_cidr_range: "10.10.73.0/26"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges: {}

      prod-proxy-only-usw4:
        region: "us-west4"
        ip_cidr_range: "100.96.0.0/22"
        purpose: "REGIONAL_MANAGED_PROXY"
        role: "ACTIVE"

      prod-psc-nat-usw4:
        region: "us-west4"
        ip_cidr_range: "100.96.4.0/26"
        purpose: "PRIVATE_SERVICE_CONNECT"

      prod-apps-usw2:
        region: "us-west2"
        ip_cidr_range: "10.20.64.0/21"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges: {}

      prod-gke-usw2:
        region: "us-west2"
        ip_cidr_range: "10.20.72.0/24"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges:
          pods: "100.65.0.0/16"
          services: "100.72.16.0/20"

      prod-psc-endpoints-usw2:
        region: "us-west2"
        ip_cidr_range: "10.20.73.0/26"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges: {}

      prod-proxy-only-usw2:
        region: "us-west2"
        ip_cidr_range: "100.97.0.0/22"
        purpose: "REGIONAL_MANAGED_PROXY"
        role: "ACTIVE"

      prod-psc-nat-usw2:
        region: "us-west2"
        ip_cidr_range: "100.97.4.0/26"
