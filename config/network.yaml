  sec-trust:
    project_ref: "prj-security-net"
    network_name: "vpc-sec-trust"
    routing_mode: "GLOBAL"
    delete_default_routes_on_create: true
    network_firewall_policy_enforcement_order: "BEFORE_CLASSIC_FIREWALL"
    ncc_attachment: "center"

    subnets:
