        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges:
          pods: "100.66.0.0/16"
          services: "100.72.32.0/20"

      preprod-psc-endpoints-usw4:
        region: "us-west4"
        ip_cidr_range: "10.10.137.0/26"
        private_ip_google_access: true
        flow_logs_enabled: true
        secondary_ip_ranges: {}

      preprod-proxy-only-usw4:
        region: "us-west4"
        ip_cidr_range: "100.96.8.0/22"
        purpose: "REGIONAL_MANAGED_PROXY"
